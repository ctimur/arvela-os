# Arvela OS — KVM 1 üzerindeki üretim projesi (Hostinger Docker Manager: "arvela-os").
# Gizli değerler (DB_PASSWORD, SETUP_TOKEN) Hostinger projesinin ortam değişkenlerindedir; buraya yazılmaz.
# Kaynak dosyalar şimdilik "arvela_src" diskine arvela-src-NN projeleriyle parça parça yazılıyor (bkz. README).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arvela
      POSTGRES_USER: arvela
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvela -d arvela"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -e
        # Dosyaları parçalarından birleştir ve SHA-256 ile doğrula. Liste (ad, parça sayısı, özet) deploy.py tarafından yazılır.
        while read n c s; do i=0; : > /app/$$n; while [ $$i -lt $$c ]; do cat /src/$$n.$$(printf %02d $$i) >> /app/$$n; i=$$((i+1)); done; echo "$$s  /app/$$n" | sha256sum -c; done <<'LISTE'
        __LISTE__
        LISTE
        npm install --omit=dev --no-audit --no-fund
        exec node server.js
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://arvela:${DB_PASSWORD}@db:5432/arvela
      SETUP_TOKEN: ${SETUP_TOKEN}
      FORGE_GITHUB_TOKEN: ${FORGE_GITHUB_TOKEN:-}
    volumes:
      - src:/src:ro
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.arvela-os.rule=Host(`os.arveladigital.com`)
      - traefik.http.routers.arvela-os.entrypoints=websecure
      - traefik.http.routers.arvela-os.tls.certresolver=letsencrypt
      - traefik.http.services.arvela-os.loadbalancer.server.port=3000
volumes:
  pgdata:
  node_modules:
  src:
    name: arvela_src
    external: true
