# Arvela OS — KVM 1 üzerindeki üretim projesi (Hostinger Docker Manager: "arvela-os").
# Gizli değerler (DB_PASSWORD, SETUP_TOKEN) Hostinger projesinin ortam değişkenlerindedir; buraya yazılmaz.
# Kaynak kod açılışta GitHub'dan, onaylanan commit'in arşivinden indirilir (FORGE_GITHUB_TOKEN, yalnız okuma yeterli).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arvela
      POSTGRES_USER: arvela
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arvela -d arvela"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command:
      - sh
      - -c
      - |
        set -e
        # Kaynak, onaylanan commit'ten GitHub'dan indirilir (commit'i deploy.py yazar). Aynı commit zaten
        # indirilmişse (yeniden başlatma) GitHub'a gidilmez; /app kalıcı birimdedir.
        S=__SHA__
        if [ "$$(cat /app/.sha 2>/dev/null)" != "$$S" ]; then
          rm -rf /tmp/k && mkdir -p /tmp/k
          node -e 'fetch("https://api.github.com/repos/ctimur/arvela-os/tarball/"+process.argv[1],{headers:{Authorization:"Bearer "+process.env.FORGE_GITHUB_TOKEN,"User-Agent":"arvela-os"}}).then(async r=>{if(!r.ok){console.error("GitHub",r.status);process.exit(1)}require("fs").writeFileSync("/tmp/k/s.tgz",Buffer.from(await r.arrayBuffer()))}).catch(e=>{console.error(e.message);process.exit(1)})' "$$S"
          tar -xzf /tmp/k/s.tgz -C /tmp/k
          test -f /tmp/k/*/app/server.js
          find /app -mindepth 1 -maxdepth 1 ! -name node_modules -exec rm -rf {} +
          cp -a /tmp/k/*/app/. /app/
          echo "$$S" > /app/.sha
          rm -rf /tmp/k
        fi
        npm install --omit=dev --no-audit --no-fund
        exec node server.js
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://arvela:${DB_PASSWORD}@db:5432/arvela
      SETUP_TOKEN: ${SETUP_TOKEN}
      FORGE_GITHUB_TOKEN: ${FORGE_GITHUB_TOKEN}
    volumes:
      - appsrc:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.arvela-os.rule=Host(`os.arveladigital.com`)
      - traefik.http.routers.arvela-os.entrypoints=websecure
      - traefik.http.routers.arvela-os.tls.certresolver=letsencrypt
      - traefik.http.services.arvela-os.loadbalancer.server.port=3000
volumes:
  pgdata:
  node_modules:
  appsrc:
