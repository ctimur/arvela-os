# Arvela · n8n otomasyon sunucusu (KVM 1) — ŞABLON. Canlı kopya Hostinger'daki 'n8n' Docker projesidir.
# Gizli değerler (N8N_DB_PASSWORD, N8N_ENCRYPTION_KEY) yalnız Hostinger proje ortamında; kapı şifresinin özeti
# canlı kopyada. N8N_ENCRYPTION_KEY değişirse n8n'deki kimlik bilgileri açılamaz.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - n8n_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # Açılışta Arvela'nın hazır iş akışlarını (sürüm değişince) bir kez içe aktarır, sonra n8n'i başlatır.
    entrypoint: ["tini", "--", "sh", "-c"]
    command:
      - |
        SEED=1
        MARK=/home/node/.n8n/.arvela-seed-$$SEED
        if [ ! -f "$$MARK" ]; then
          if wget -qO /tmp/arvela-seed.json https://os.arveladigital.com/api/n8n-seed; then
            n8n import:workflow --input=/tmp/arvela-seed.json && touch "$$MARK" && echo "Arvela akışları içe aktarıldı"
          else
            echo "Arvela akışları alınamadı; bir sonraki açılışta yeniden denenecek"
          fi
        fi
        exec n8n start
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.arveladigital.com
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.arveladigital.com/
      N8N_EDITOR_BASE_URL: https://n8n.arveladigital.com/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
      N8N_DEFAULT_LOCALE: en
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.http.middlewares.n8n-gate.basicauth.users=arvela:<HTPASSWD_HASH  ($ işaretleri $$ olarak yazılır)>
      - traefik.http.middlewares.n8n-gate.basicauth.realm=Arvela n8n
      - traefik.http.routers.n8n.rule=Host(`n8n.arveladigital.com`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=letsencrypt
      - traefik.http.routers.n8n.middlewares=n8n-gate
      - traefik.http.routers.n8n.priority=10
      - traefik.http.routers.n8n-hooks.rule=Host(`n8n.arveladigital.com`) && (PathPrefix(`/webhook/`) || PathPrefix(`/form/`) || Path(`/healthz`))
      - traefik.http.routers.n8n-hooks.entrypoints=websecure
      - traefik.http.routers.n8n-hooks.tls.certresolver=letsencrypt
      - traefik.http.routers.n8n-hooks.priority=100
      - traefik.http.routers.n8n-hooks.service=n8n
      - traefik.http.routers.n8n.service=n8n
volumes:
  n8n_pg:
  n8n_data:
