name: PR kontrol

# Forge: her Pull Request yayına girmeden önce burada sınanır. Testleri geçmeyen değişiklik Arvela OS'te onaylanamaz.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sözdizimi kontrolü
        run: |
          for f in app/*.js app/social/*.mjs; do node --check "$f"; done
          for f in app/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - name: Testler
        run: for t in tests/*.test.mjs; do node "$t" || exit 1; done
      - name: Betik testleri
        run: python3 -c "import yaml" 2>/dev/null || pip install pyyaml; for t in tests/*_test.py; do python3 "$t" || exit 1; done; sh -n app/backup.sh && sh -n deploy/n8n_backup.sh
      - name: Parçalar sınıra sığıyor mu
        run: python3 deploy/rechunk.py
      - name: Parçalar birleşince dosyayı birebir veriyor mu
        run: python3 -c "import yaml" 2>/dev/null || pip install pyyaml; python3 deploy/verify_chunks.py
