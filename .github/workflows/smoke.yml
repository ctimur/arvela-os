name: Duman testi

# Dışarıdan temel kontroller: Arvela OS, API kapıları ve n8n. Elle: Actions → Duman testi → Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kontroller
        run: |
          set -u; fail=0
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "${@:3}" "$2"); if [ "$code" = "$1" ]; then echo "OK   $code  $2"; else echo "HATA $code (beklenen $1)  $2"; fail=1; fi; }
          check 200 https://os.arveladigital.com/healthz
          check 302 https://os.arveladigital.com/panel
          check 401 https://os.arveladigital.com/api/v1/me
          check 401 https://os.arveladigital.com/api/v1/me -H 'Authorization: Bearer arv_00000000_xxxxxxxxxxxxxxxxxxxxxxxx'
          check 403 https://os.arveladigital.com/api/site-sync -X POST
          check 200 https://os.arveladigital.com/api/n8n-seed
          check 200 https://n8n.arveladigital.com/healthz
          check 401 https://n8n.arveladigital.com/
          check 401 https://n8n.arveladigital.com/rest/settings
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://n8n.arveladigital.com/webhook/arvela-events); echo "BİLGİ $code  n8n webhook (akış pasifken 404, etkinken 403/200 beklenir)"
          curl -s https://os.arveladigital.com/healthz; echo
          exit $fail
