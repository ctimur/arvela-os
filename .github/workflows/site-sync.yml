name: Site durumu

# Her sabah 06:20 (İstanbul) Hostinger'daki sitelerin SSL ve WordPress durumunu Arvela OS'e aktarır.
# Elle çalıştırmak için: Actions → Site durumu → Run workflow.
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Yayına al']
    types: [completed]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
      - name: Hostinger'dan oku, Arvela OS'e gönder
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: python3 deploy/site_sync.py
