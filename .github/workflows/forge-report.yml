name: Forge bildir

# Açık değişiklikleri (PR) ve yayınları Arvela OS → Forge sayfasına bildirir.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, closed]
  workflow_run:
    workflows: ['PR kontrol', 'Yayına al']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: forge-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Arvela OS'e bildir
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
        run: python3 deploy/forge.py report
